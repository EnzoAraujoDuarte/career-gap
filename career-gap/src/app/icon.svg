<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Career Gap">
  <!-- A estrada da trilha e o "você está aqui" (ADR-0011), nas cores do papel e da tinta.
       Segue o tema do sistema: Chrome e Firefox leem a media query dentro do SVG. -->
  <style>
    .paper { fill: #fdfbf7; }
    .ahead { stroke: #9a948a; }
    .walked { stroke: #1c1b19; }
    .here { fill: #2c5aa0; stroke: #fdfbf7; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #16140f; }
      .ahead { stroke: #8c8676; }
      .walked { stroke: #efe9dc; }
      .here { fill: #93b6ea; stroke: #16140f; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="8"/>
  <path class="ahead" d="M20 16 C20 9.5 14 9.5 14 3" fill="none" stroke-width="3.4" stroke-linecap="round"/>
  <path class="walked" d="M12 30 C12 23 20 23 20 16" fill="none" stroke-width="3.4" stroke-linecap="round"/>
  <circle class="here" cx="20" cy="16" r="5" stroke-width="2"/>
</svg>
